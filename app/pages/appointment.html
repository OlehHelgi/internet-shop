<main class="main">
  <section class="appointment">
    <div class="container">
      <h1 class="section-title appointment__title">Book an appointment</h1>
      <div class="appointment__box">
        <form class="appointment__box-form" action="">
          <h2 class="appointment__box-title">Contact information</h2>
          <p class="appointment__box-text">Fill in your contact details</p>
          <label for="first-name" aria-label="Enter your first name"></label>
          <input class="appointment__input" id="first-name" type="text" placeholder="First name">

          <label for="last-name" aria-label="Enter your last name"></label>
          <input class="appointment__input" id="last-name" type="text" placeholder="Last name">

          <label for="user-email" aria-label="Enter your email"></label>
          <input class="appointment__input" id="user-email" type="email" placeholder="Email">

          <label for="user-telephon" aria-label="Enter your mobile"></label>
          <input class="appointment__input" id="user-telephon" type="tel" placeholder="Mobile">

          <button class="big-btn appointment__btn" type="submit">Send</button>
        </form>
        <picture>
          <source srcset="images/appointment.avif" type="image/avif">
          <source srcset="images/appointment.webp" type="image/webp">
          <img class="appointment__img" src="images/appointment.jpg" alt="D. Beckham">
        </picture>
      </div>
    </div>
  </section>
</main>
