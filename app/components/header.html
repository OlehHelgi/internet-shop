<header class="header">
  <div class="container">
    <div class="header__inner">
      <button class="menu__btn">
        <svg width="30" height="19">
          <use xlink:href="images/sprite.svg#mobile-btn"></use>
        </svg>
      </button>
      <div class="header__logo">
        <a class="logo" href="#">
          <img src="images/logo.svg" alt="logo">
        </a>
      </div>
      <nav class="menu">
        <ul class="header__lang">
          <li class="header__lang-item">
            <a href="#" class="header__lang-link header__lang-link--active">EN</a>/
          </li>
          <li class="header__lang-item">
            <a href="#" class="header__lang-link">UA</a>
          </li>
        </ul>
        <ul class="menu__list">
          <li class="menu__item">
            <a href="#" class="menu__link" data-text="Catalog">Catalog</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link" data-text="Collections">Collections</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link" data-text="About">About</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link" data-text="Book an appointment">Book an appointment</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link" data-text="Contact">Contact</a>
          </li>
        </ul>
      </nav>
      <ul class="header__actions">
        <li class="header__actions-item">
          <a href="#" class="header__actions-link" aria-label="Sign in" target="_blank" rel="noopener noreferrer">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#user"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a href="#" class="header__actions-link" aria-label="Wish list" target="_blank" rel="noopener noreferrer">
            <svg width="24" height="21">
              <use xlink:href="images/sprite.svg#wish-list"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item">
          <a href="#" class="header__actions-link" aria-label="Shopping bag" target="_blank" rel="noopener noreferrer">
            <svg width="24" height="24">
              <use xlink:href="images/sprite.svg#shopping-bag"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
